# .github/workflows/security.yml (in your Terraform repo)
name: security

on:
  push:
  pull_request:

jobs:
  dev-scan:
    uses: YOUR_GITHUB_ORG/gcp-security-workflows/.github/workflows/dev-scan.yml@dev
    with:
      results_bucket: results_bucket1
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      RESULTS_UPLOADER_SA: ${{ secrets.RESULTS_UPLOADER_SA }}