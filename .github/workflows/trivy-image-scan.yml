name: Trivy image scan

on:
  workflow_dispatch:
    inputs:
      image:
        description: Full container image reference to scan.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  RESULTS_BUCKET: project_trivy_1

jobs:
  trivy-image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.RESULTS_UPLOADER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Calculate GCS partition path
        id: partition
        shell: bash
        run: |
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Prepare results directory
        run: mkdir -p trivy-image-results

      - name: Run image scan as JSON
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}
          format: json
          output: trivy-image-results/trivy-image.json
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run image scan as SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}
          format: sarif
          output: trivy-image-results/trivy-image.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload reports as GitHub artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-${{ github.run_id }}
          path: trivy-image-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results/trivy-image.sarif
        continue-on-error: true

      - name: Upload reports to GCS
        if: always()
        run: |
          gcloud storage cp -r trivy-image-results/* \
            "gs://${RESULTS_BUCKET}/year=${{ steps.partition.outputs.year }}/month=${{ steps.partition.outputs.month }}/day=${{ steps.partition.outputs.day }}/tool=trivy_image/run_id=${{ github.run_id }}/"
